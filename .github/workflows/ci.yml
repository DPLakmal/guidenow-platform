name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-go:
    name: Test Go Microservices
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: go/go.sum

      - name: Run Tests
        working-directory: ./go
        run: |
          go mod tidy
          go test -v ./...

      - name: Verify Builds
        working-directory: ./go
        run: |
          go build -v -o /dev/null ./cmd/gateway
          go build -v -o /dev/null ./cmd/guide
          go build -v -o /dev/null ./cmd/matching
          go build -v -o /dev/null ./cmd/chat
          go build -v -o /dev/null ./cmd/ai
          go build -v -o /dev/null ./cmd/booking

  build-web:
    name: Build Next.js Web Portal
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install Dependencies
        working-directory: ./web
        run: npm ci

      - name: Build Web Application
        working-directory: ./web
        run: npm run build

  test-flutter:
    name: Test Flutter Mobile App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'

      - name: Install Dependencies
        working-directory: ./flutter
        run: flutter pub get

      - name: Run Flutter Tests
        working-directory: ./flutter
        run: flutter test
